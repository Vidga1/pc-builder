name: PC Builder CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pc-builder-${{ github.ref == 'refs/heads/main' && 'production' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-chart:
    name: Validate Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.18.3
      - name: Lint and render
        run: |
          set -euo pipefail
          helm lint helm/pc-builder
          helm template pc-builder helm/pc-builder \
            --namespace pc-builder \
            --set-string image.tag=ci-test > /tmp/pc-builder-rendered.yaml
          grep -q 'ghcr.io/vidga1/pc-builder:ci-test' /tmp/pc-builder-rendered.yaml

  image:
    name: Build Docker image
    needs: validate-chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build; publish immutable commit image on main
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: ghcr.io/vidga1/pc-builder:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes on REG.RU
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure verified SSH host and private key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            if [[ -z "$(printenv "$name")" ]]; then
              echo "::error::Missing $name. See CI_CD.md before enabling deployment."
              exit 1
            fi
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Send chart and upgrade release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          chart_archive="$RUNNER_TEMP/pc-builder-$GITHUB_SHA.tgz"
          tar -C helm -czf "$chart_archive" pc-builder

          scp -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$chart_archive" "$VPS_USER@$VPS_HOST:/tmp/pc-builder-$GITHUB_SHA.tgz"

          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          image_tag="$1"
          archive="/tmp/pc-builder-$image_tag.tgz"
          workdir="$(mktemp -d /tmp/pc-builder-deploy.XXXXXXXX)"
          trap 'rm -rf "$workdir" "$archive"' EXIT
          tar -xzf "$archive" -C "$workdir"

          export KUBECONFIG=/etc/kubernetes/admin.conf

          # Adopt existing kubectl-managed objects manually before enabling CI/CD.
          if ! helm status pc-builder --namespace pc-builder >/dev/null 2>&1; then
            echo "No pc-builder Helm release. Complete one-time setup in DEPLOY.md first." >&2
            exit 1
          fi

          helm upgrade pc-builder "$workdir/pc-builder" \
            --namespace pc-builder \
            --set-string "image.tag=$image_tag" \
            --wait --atomic --timeout 10m

          kubectl rollout status deployment/pc-builder \
            --namespace pc-builder --timeout=120s
          kubectl -n pc-builder get deployment pc-builder \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
          REMOTE
