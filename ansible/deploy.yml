---
# Run only after site.yml has created a healthy Kubernetes cluster.
- name: Deploy PC Builder infrastructure and application
  hosts: control_plane
  become: true
  vars:
    kubeconfig_path: /etc/kubernetes/admin.conf
    pc_builder_manifests_dir: /opt/pc-builder/k8s
    pc_builder_secrets_file: "{{ playbook_dir }}/../.env.k8s"

  pre_tasks:
    - name: Check the local production secrets file
      ansible.builtin.stat:
        path: "{{ pc_builder_secrets_file }}"
      delegate_to: localhost
      become: false
      register: secrets_file_stat

    - name: Require production secrets before deploying
      ansible.builtin.assert:
        that:
          - secrets_file_stat.stat.exists
          - secrets_file_stat.stat.isreg
        fail_msg: >-
          Create .env.k8s in the project root (see ansible/secrets.example).
          Never commit this file to Git.

  roles:
    - helm
    - traefik
    - cert_manager
    - pc_builder
