---
- name: Create deployment manifest directory
  ansible.builtin.file:
    path: "{{ pc_builder_manifests_dir }}"
    state: directory
    mode: "0755"

- name: Upload Traefik configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../k8s/traefik-values.yaml"
    dest: "{{ pc_builder_manifests_dir }}/traefik-values.yaml"
    mode: "0644"

- name: Add Traefik Helm repository
  ansible.builtin.command:
    argv:
      - helm
      - repo
      - add
      - traefik
      - https://traefik.github.io/charts
      - --force-update
  changed_when: false

- name: Update Traefik chart index
  ansible.builtin.command: helm repo update traefik
  changed_when: false

- name: Wait for worker to be ready
  ansible.builtin.command: kubectl wait --for=condition=Ready node/k8s-worker --timeout=180s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false

- name: Install or upgrade Traefik
  ansible.builtin.command:
    argv:
      - helm
      - upgrade
      - --install
      - traefik
      - traefik/traefik
      - --namespace
      - traefik
      - --create-namespace
      - --values
      - "{{ pc_builder_manifests_dir }}/traefik-values.yaml"
      - --wait
      - --timeout
      - 8m
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
